name: Copy context.md to Destination

on:
  push:
    branches:
      - main
    paths:
      - 'context.md'

  workflow_dispatch:

jobs:
  copy-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Clone Destination Repo & Copy File
        env:
          DEST_TOKEN: ${{ secrets.MY_DESTINATION_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${DEST_TOKEN}@github.com/siddhant21074/Knowledge-Base-.git" dest_repo

          cp context.md dest_repo/context.md

          cd dest_repo

          git add context.md

          if git diff --cached --quiet; then
            echo "No changes detected in context.md. Skipping push."
          else
            git commit -m "Automated update of context.md from Source Repo"
            git push origin HEAD:main
          fi
