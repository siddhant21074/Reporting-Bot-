<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ status }} · {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='img/tks-mark.svg') }}">
</head>
<body>
<div class="error-page">
  <div class="error-card">
    <img class="error-logo" src="{{ url_for('static', path='img/techknomatic.svg') }}"
         alt="Techknomatic Services Pvt Ltd" width="200" height="62">
    <p class="error-code">{{ status }}</p>
    <h1>{{ title }}</h1>
    <p class="error-message">{{ message }}</p>
    <div class="row" style="justify-content:center;margin-top:22px">
      <a class="btn btn-primary" href="/">Back to the dashboard</a>
      <form method="post" action="/logout"><button class="btn" type="submit">Sign out</button></form>
    </div>
    <p class="error-copyright">&copy; {{ year }} Techknomatic Services Pvt Ltd</p>
  </div>
</div>
</body>
</html>
